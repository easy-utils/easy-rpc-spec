syntax = "proto3";

package easyrpc.conformance.v1;

option go_package = "github.com/easy-utils/easy-rpc-go/conformance/v1;conformancev1";
import "google/api/annotations.proto";

message EchoRequest { string input = 1; }
message EchoResponse { string output = 1; }

message CountRequest { int32 count = 1; }
message CountResponse { int32 index = 1; }

message FailRequest { string message = 1; }
message FailResponse { bool ok = 1; }

message HealthRequest {}
message HealthResponse { bool ok = 1; string name = 2; }

service ConformanceService {
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = { get: "/v1/health" };
  }

  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (google.api.http) = { post: "/v1/echo" body: "*" };
  }

  rpc Count(CountRequest) returns (stream CountResponse) {
    option (google.api.http) = { post: "/v1/count" body: "*" };
  }

  rpc Fail(FailRequest) returns (FailResponse) {
    option (google.api.http) = { post: "/v1/fail" body: "*" };
  }

  // Emit N frames then end the stream with a Connect end-stream error.
  rpc StreamFail(StreamFailRequest) returns (stream StreamFailResponse) {
    option (google.api.http) = { post: "/v1/stream-fail" body: "*" };
  }

  // Echo selected request metadata back in the response.
  rpc EchoMeta(EchoMetaRequest) returns (EchoMetaResponse) {
    option (google.api.http) = { post: "/v1/echo-meta" body: "*" };
  }

  // Return `size` bytes to exercise max-message behavior.
  rpc Big(BigRequest) returns (BigResponse) {
    option (google.api.http) = { post: "/v1/big" body: "*" };
  }

  // Fail the unary call with an error carrying structured details.
  rpc FailDetails(FailDetailsRequest) returns (FailDetailsResponse) {
    option (google.api.http) = { post: "/v1/fail-details" body: "*" };
  }

  // Emit N frames, then fail the stream with an error carrying details.
  rpc StreamFailDetails(StreamFailDetailsRequest) returns (stream StreamFailDetailsResponse) {
    option (google.api.http) = { post: "/v1/stream-fail-details" body: "*" };
  }
}

// ---- Phase C additions: stream-end error + metadata + big payload ----

message StreamFailRequest {
  // Emit this many data frames, then fail with `code`.
  int32 emit_before = 1;
  int32 code = 2;
  string message = 3;
}
message StreamFailResponse { int32 index = 1; }

message EchoMetaRequest { string input = 1; }
message EchoMetaResponse {
  string input = 1;
  map<string, string> meta = 2;   // mirrors selected request metadata
}

message BigRequest { int32 size = 1; }
message BigResponse { int32 size = 2; }

// ---- Error-details conformance (spec §4.1) ----

message FailDetailsRequest {
  int32 code = 1;
  string message = 2;
  string detail_type = 3;  // ErrorDetail.type (a type URL)
  string detail_text = 4;  // ErrorDetail.value bytes (UTF-8 text for testing)
}
message FailDetailsResponse { bool ok = 1; }

message StreamFailDetailsRequest {
  int32 emit_before = 1;
  int32 code = 2;
  string message = 3;
  string detail_type = 4;
  string detail_text = 5;
}
message StreamFailDetailsResponse { int32 index = 1; }
